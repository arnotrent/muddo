{% extends "base.html" %}
{% block title %}Page Not Found — Muddo Agro{% endblock %}
{% block content %}
<section style="min-height:75vh;display:flex;align-items:center;justify-content:center;text-align:center;padding:60px 20px">
  <div>
    <div style="font-size:7rem;font-weight:900;font-family:'Playfair Display',serif;background:linear-gradient(135deg,var(--orange),var(--blue));-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text;margin-bottom:8px">404</div>
    <h1 style="font-size:1.8rem;color:var(--text-primary);margin-bottom:12px">Page Not Found</h1>
    <p style="color:var(--text-muted);max-width:40ch;margin:0 auto 32px;line-height:1.72">The page you're looking for doesn't exist or has been moved.</p>
    <div style="display:flex;gap:12px;justify-content:center;flex-wrap:wrap">
      <a href="{% url 'index' %}" class="btn-green" style="padding:11px 22px;border-radius:10px"><i class="fas fa-home"></i>Go Home</a>
      <a href="{% url 'pesticides' %}" class="btn-outline" style="padding:11px 22px;border-radius:10px"><i class="fas fa-flask"></i>Browse Products</a>
      <a href="{% url 'contact' %}" class="btn-outline" style="padding:11px 22px;border-radius:10px"><i class="fas fa-envelope"></i>Contact Us</a>
    </div>
  </div>
</section>
{% endblock %}
